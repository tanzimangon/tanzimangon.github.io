<style>
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }

/* Layout: one narrow centered column, big name on top, grouped iOS-style link lists below */
:root {
  --bg: #f5f5f7;
  --surface: #ffffff;
  --fg: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(0, 0, 0, 0.09);
  --accent: #0071e3;
  --press: rgba(0, 0, 0, 0.05);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000;
    --surface: #1c1c1e;
    --fg: #f5f5f7;
    --muted: #a1a1a6;
    --line: rgba(255, 255, 255, 0.12);
    --accent: #2997ff;
    --press: rgba(255, 255, 255, 0.07);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000;
  --surface: #1c1c1e;
  --fg: #f5f5f7;
  --muted: #a1a1a6;
  --line: rgba(255, 255, 255, 0.12);
  --accent: #2997ff;
  --press: rgba(255, 255, 255, 0.07);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font);
  font-size: 17px;
  line-height: 1.4;
  -webkit-font-smoothing: antialiased;
  padding-block: 56px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.page {
  max-width: 520px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* Hero */
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; }
.avatar {
  width: 112px; height: 112px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 40px; font-weight: 600; letter-spacing: -0.02em; color: #fff;
  background: linear-gradient(145deg, #5ac8fa 0%, #0071e3 55%, #5e5ce6 100%);
  box-shadow: 0 10px 30px rgba(0, 113, 227, 0.28);
  margin-bottom: 14px;
  overflow: hidden;
}
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
h1 {
  margin: 0;
  font-size: clamp(32px, 9vw, 46px);
  line-height: 1.08;
  font-weight: 700;
  letter-spacing: -0.03em;
  text-wrap: balance;
}

/* Primary action */
.primary {
  display: flex; align-items: center; justify-content: center;
  min-height: 52px; border-radius: 999px;
  background: var(--accent); color: #fff;
  font-weight: 600; font-size: 17px; text-decoration: none;
  transition: transform 0.15s ease, filter 0.15s ease;
}
.primary:hover { filter: brightness(1.08); }
.primary:active { transform: scale(0.98); }

/* Groups */
.group { display: flex; flex-direction: column; gap: 8px; }
.label {
  margin: 0; padding-inline: 16px;
  font-size: 13px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--muted);
}
.list { background: var(--surface); border-radius: 18px; overflow: hidden; }
.row {
  display: flex; align-items: center; gap: 14px;
  padding: 12px 16px; min-height: 64px;
  color: inherit; text-decoration: none;
  position: relative;
  transition: background 0.15s ease;
}
.row + .row::before {
  content: ""; position: absolute; top: 0; left: 70px; right: 0;
  height: 1px; background: var(--line);
}
.row:hover, .row:active { background: var(--press); }
.row:focus-visible { outline: 3px solid var(--accent); outline-offset: -3px; border-radius: 18px; }
.icon {
  flex: none; width: 40px; height: 40px; border-radius: 10px;
  display: grid; place-items: center; color: #fff;
}
.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon svg text { fill: currentColor; stroke: none; font-family: var(--font); font-weight: 700; }
.text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.name { font-weight: 600; letter-spacing: -0.01em; }
.handle { font-size: 14px; color: var(--muted); overflow-wrap: anywhere; }
.chev { flex: none; width: 8px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.7; }

.ig { background: linear-gradient(45deg, #feda75, #fa7e1e 30%, #d62976 60%, #4f5bd5); }
.fb { background: #1877f2; }
.li { background: #0a66c2; }
.wa { background: #25d366; }
.em { background: linear-gradient(180deg, #5ac8fa, #0a84ff); }

.foot { text-align: center; color: var(--muted); font-size: 13px; display: flex; flex-direction: column; gap: 4px; align-items: center; }
.nfc {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 999px;
  background: var(--surface); font-size: 12px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase;
}
.nfc i { width: 7px; height: 7px; border-radius: 50%; background: #34c759; display: block; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}

</style>
</head>
<body>
